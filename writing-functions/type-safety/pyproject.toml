[project]
name = "type-safety"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

## development-only dependencies (not part of the shipped code).
## uv installs these by default; exclude them with `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pyright>=1.1",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
